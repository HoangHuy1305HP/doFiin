services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dofiin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dofiin_local}
      POSTGRES_DB: dofiin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dofiin -d dofiin"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://dofiin:${DB_PASSWORD:-dofiin_local}@db:5432/dofiin
      JWT_SECRET: ${JWT_SECRET:?Generate JWT_SECRET in .env first}
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}'
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"]
volumes:
  postgres_data:
