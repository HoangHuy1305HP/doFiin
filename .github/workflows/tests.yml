name: Backend checks
on: [push, pull_request]
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dofiin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: dofiin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dofiin -d dofiin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://dofiin:test_password@localhost:5432/dofiin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check app tests migrations scripts
      - run: ruff format --check app tests migrations scripts
      - run: pytest

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
